[package]
name = "markdownshot"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
markdownshot-core = { path = "../core" }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
winit = "0.30"
softbuffer = "0.4"
tray-icon = "0.26"
global-hotkey = "0.9"
xcap = "0.9"
arboard = { version = "3", default-features = false }
rfd = "0.17"
fontdue = "0.9"
egui = "0.34"
egui-winit = "0.34"
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }
bytemuck = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_Globalization"] }

[build-dependencies]
embed-resource = "3"
