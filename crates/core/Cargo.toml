[package]
name = "markdownshot-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1"
log = "0.4"
webp = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22", "directml"] }
